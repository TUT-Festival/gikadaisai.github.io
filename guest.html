  <body>
    <!-- 準備中スクリーン（FOUC防止: js/site-loader.js が解除する） -->
    <div class="site-prerender-screen"></div>
    <div id="container">
      <header></header>

      <div id="contents">
        <main>
          <section style="position: relative">
            <div
              class="deco-circle deco-circle--dashed deco-circle--xl"
              style="top: -80px; right: -100px"
            ></div>
            <div
              class="deco-circle deco-circle--filled deco-circle--lg"
              style="top: 200px; left: -60px"
            ></div>
            <div
              class="deco-circle deco-circle--solid deco-circle--sm"
              style="top: 50px; left: 20%"
            ></div>
            <h1><span>Guests</span><span class="hosoku">ゲスト情報</span></h1>
            <div id="guest-container"></div>
          </section>
        </main>
      </div>
      <footer></footer>
    </div>

    <script
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"
      integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/protonet-jquery.inview/1.1.2/jquery.inview.min.js"
      integrity="sha384-pd7qbPsmTJfjFiks31ehUn6A68yiF8HXwV4anhaOf8icgDte+6V3PCNNYs933QCg"
      crossorigin="anonymous"
    ></script>

    <script src="js/escape-html.js"></script>
    <script src="js/main.js"></script>
    <script src="js/site-loader.js"></script>
    <script src="js/page-visibility.js"></script>

    <script>
      // escapeHtml() は js/escape-html.js が提供する
      // guest.json を読み込みゲスト情報を動的に描画
      document.addEventListener("DOMContentLoaded", async function () {
        var container = document.getElementById("guest-container");
        if (!container) return;

        try {
          var res = await fetch("js/guest.json");
          if (!res.ok) throw new Error("guest.json の読み込みに失敗");
          var events = await res.json();

          var html = "";
          events.forEach(function (ev) {
            var datetimeLines = ev.displayDatetime
              ? escapeHtml(ev.displayDatetime).replace(/\n/g, "<br>")
              : "";
            var descLines = ev.description
              ? escapeHtml(ev.description).replace(/\n/g, "<br>")
              : "";
            var warningLines = ev.warningText
              ? escapeHtml(ev.warningText).replace(/\n/g, "<br>")
              : "";
            var closingText = escapeHtml(ev.closingText || "");

            html += '<p class="c">';
            html += "<strong>" + datetimeLines + "</strong><br>";
            html += descLines;
            html += "</p>";

            if (ev.poster) {
              html +=
                '<div class="poster" style="max-width: 600px; margin: 2rem auto;">';
              html +=
                '<img src="' +
                escapeHtml(ev.poster) +
                '" alt="' +
                escapeHtml(ev.title) +
                ' ポスター">';
              html += "</div>";
            }

            if (ev.cautions && ev.cautions.length > 0) {
              html += "<h3>注意事項</h3>";
              html +=
                "<p>企画会場でのマナーに関して会場施設を傷つける行為や、一般の方、近隣にお住まいの方のご迷惑となる行為は絶対におやめください。</p>";
              html += "<ul>";
              ev.cautions.forEach(function (c) {
                html += "<li>" + escapeHtml(c) + "</li>";
              });
              html += "</ul>";
            }

            if (ev.otherNotes && ev.otherNotes.length > 0) {
              html += "<h3>その他注意事項</h3>";
              html += "<ul>";
              ev.otherNotes.forEach(function (n) {
                html += "<li>" + escapeHtml(n) + "</li>";
              });
              html += "</ul>";
            }

            if (warningLines) html += "<p>" + warningLines + "</p>";
            if (closingText)
              html +=
                '<p class="c" style="margin-top: 2rem;"><strong>' +
                closingText +
                "</strong></p>";
          });

          container.innerHTML = html;
        } catch (error) {
          console.error(error);
          container.textContent = "情報の読み込み中にエラーが発生しました。";
        }
      });
    </script>
  </body>
</html>
