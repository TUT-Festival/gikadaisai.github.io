<!doctype html>

  <body>
    <!-- 準備中スクリーン（FOUC防止: js/site-loader.js が解除する） -->
    <div class="site-prerender-screen"></div>
    <div id="container">
      <header></header>

      <div id="contents">
        <main>
          <section>
            <div
              class="deco-circle deco-circle--dashed deco-circle--xl"
              style="top: -60px; right: -80px"
            ></div>
            <div
              class="deco-circle deco-circle--filled deco-circle--lg"
              style="top: 200px; left: -50px"
            ></div>
            <div
              class="deco-circle deco-circle--solid deco-circle--sm"
              style="top: 100px; left: 25%"
            ></div>

            <h1><span>Access</span><span class="hosoku">会場アクセス</span></h1>

            <div class="map-container" style="margin-top: 3rem">
              <iframe
                id="google-maps-embed"
                src=""
                width="100%"
                height="450"
                style="border: 0"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
              ></iframe>
            </div>

            <div class="access-container" style="margin-top: 4rem">
              <div class="access-info">
                <div class="access-card">
                  <div class="access-card-header">
                    <i class="fas fa-university"></i>
                    <h3>豊橋技術科学大学</h3>
                  </div>
                  <p class="access-address">
                    〒441-8580 愛知県豊橋市天伯町雲雀ヶ丘1-1<br />
                    TEL: 0532-44-6513 (広報係)
                  </p>
                </div>

                <!-- アクセス案内は js/site-config.json の access.methods で管理 -->
                <div data-include="access-methods"></div>
              </div>
              <div data-include="access-map"></div>
            </div>
          </section>
        </main>
      </div>
      <footer></footer>
    </div>

    <script
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"
      integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/protonet-jquery.inview/1.1.2/jquery.inview.min.js"
      integrity="sha384-pd7qbPsmTJfjFiks31ehUn6A68yiF8HXwV4anhaOf8icgDte+6V3PCNNYs933QCg"
      crossorigin="anonymous"
    ></script>

    <script src="js/escape-html.js"></script>
    <script src="js/main.js"></script>
    <script src="js/site-loader.js"></script>
    <script src="js/page-visibility.js"></script>
    <script src="js/bus-countdown.js"></script>

    <script>
      // site-config 読み込み後に Google Maps 埋め込みの URL を設定
      // （経路ボタンのリンクは site-loader.js が生成時に設定する）
      window.onSiteConfig(function (config) {
        var embedIframe = document.getElementById("google-maps-embed");
        if (embedIframe) embedIframe.src = config.access.googleMapsEmbed;
      });
    </script>
  </body>
