    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const shopListContainer = document.getElementById("shop-list");
        const filterSelect = document.getElementById("filter-type");
        const sortKeySelect = document.getElementById("sort-key");
        const sortOrderSelect = document.getElementById("sort-order");

        let allShops = [];

        // フィルタ/ソートの change からも呼ばれるため、
        // 描画失敗時に一覧が無反応のまま固まらないよう自前で握る。
        const renderList = () => {
          if (!shopListContainer) return;
          try {
            const filterValue = filterSelect.value;
            let filteredShops;

            if (filterValue === "all") {
              filteredShops = [...allShops];
            } else {
              filteredShops = allShops.filter(
                (shop) => shop.category === filterValue,
              );
            }
            const sortKey = sortKeySelect.value;
            const sortOrder = sortOrderSelect.value;
            if (sortKey !== "default") {
              filteredShops.sort((a, b) =>
                sortCompare(a, b, sortKey, sortOrder),
              );
            }
            shopListContainer.innerHTML =
              generateHtmlForShops(filteredShops) ||
              "<p>該当する企画はありません。</p>";
          } catch (error) {
            console.error(error);
            shopListContainer.textContent = "一覧の表示に失敗しました。";
          }
        };

        const sortCompare = (a, b, key, order) => {
          let valA = a[key];
          let valB = b[key];
          let comparison = String(valA).localeCompare(String(valB), "ja", {
            numeric: true,
            sensitivity: "base",
          });
          return order === "asc" ? comparison : -comparison;
        };

        // アイコンのファイル名は URL に直接埋まるため、
        // エスケープではなく想定形式そのものを検証し、外れたら既定画像に落とす。
        const SAFE_ICON_NAME = /^[A-Za-z0-9_-]+\.(png|jpe?g|webp|gif)$/;
        const safeIconName = (name) =>
          SAFE_ICON_NAME.test(String(name || ""))
            ? String(name)
            : "default.png";

        const generateHtmlForShops = (shops) => {
          return shops
            .map((shop) => {
              const safeTitle = escapeHtml(shop.title);
              const safeCircle = escapeHtml(shop.circle);
              const safeLocation = escapeHtml(shop.location);
              const safeComment = shop.comment ? escapeHtml(shop.comment) : "";
              const imgData = shop.img;
              let imgHtml = "";
              if (Array.isArray(imgData) && imgData.length >= 2) {
                // 複数画像: multi-img スライダー
                const first = safeIconName(imgData[0] || "");
                // data-imgs にJSON文字列で全画像を保存
                const imgsJson = JSON.stringify(
                  imgData.map((n) => safeIconName(n)),
                ).replace(/"/g, "&quot;");
                const dots = imgData
                  .map(
                    (_, i) =>
                      `<span class="dot${i === 0 ? " active" : ""}"></span>`,
                  )
                  .join("");
                imgHtml = `
                    <div class="shop-card-image multi-img" data-idx="0" data-imgs="${imgsJson}">
                      <img src="data/shop/icon/${first}" alt="${safeCircle} アイコン" onerror="this.onerror=null; this.src='data/shop/icon/default.png';">
                      <div class="img-dots">${dots}</div>
                    </div>`;
              } else {
                const src = safeIconName(
                  Array.isArray(imgData) ? imgData[0] : imgData,
                );
                imgHtml = `<div class="shop-card-image"><img src="data/shop/icon/${src}" alt="${safeCircle} アイコン" onerror="this.onerror=null; this.src='data/shop/icon/default.png';"></div>`;
              }
              const commentHtml = safeComment
                ? `
                      <div class="shop-card-comment">
                        <button type="button" class="shop-card-comment-toggle" aria-expanded="false">
                          <i class="fas fa-comment"></i>
                          <span>コメント</span>
                          <i class="fas fa-chevron-down shop-card-comment-chevron"></i>
                        </button>
                        <div class="shop-card-comment-body">
                          <p class="shop-card-comment-text">${safeComment}</p>
                        </div>
                      </div>`
                : "";
              return `
                  <div class="shop-card">
                    ${imgHtml}
                    <div class="shop-card-content">
                      <p class="shop-card-title">${safeTitle}</p>
                      <div class="shop-card-footer">
                        <span class="shop-card-circle">${safeCircle}</span>
                        <span class="shop-card-location">${safeLocation}</span>
                      </div>
                      ${commentHtml}
                    </div>
                  </div>`;
            })
            .join("");
        };

        // ---- スライダー：クリック & スワイプ ----
        // イベントデリゲーションで shopListContainer に一度だけ登録
        let sliderTouchX = null;

        function switchSlide(card, dir) {
          const imgs = JSON.parse(card.dataset.imgs.replace(/&quot;/g, '"'));
          let idx = parseInt(card.dataset.idx, 10);
          const nextIdx = (idx + dir + imgs.length) % imgs.length;
          card.dataset.idx = nextIdx;

          const currentImg = card.querySelector("img");
          if (!currentImg) return;

          // 現在の img をアウト方向にアニメーション
          const outClass = dir > 0 ? "anim-out-left" : "anim-out-right";
          currentImg.classList.add(outClass);

          // 新しい img を生成してインアニメーション
          const newImg = document.createElement("img");
          newImg.src = `data/shop/icon/${imgs[nextIdx]}`;
          newImg.alt = currentImg.alt;
          newImg.onerror = function () {
            this.onerror = null;
            this.src = "data/shop/icon/default.png";
          };
          const inClass = dir > 0 ? "anim-in-right" : "anim-in-left";
          newImg.classList.add(inClass);
          card.insertBefore(newImg, card.querySelector(".img-dots"));

          // アウト完了後に古い img を削除
          currentImg.addEventListener(
            "animationend",
            () => {
              currentImg.remove();
              newImg.classList.remove(inClass);
            },
            { once: true },
          );

          // ドット更新
          card.querySelectorAll(".dot").forEach((d, i) => {
            d.classList.toggle("active", i === nextIdx);
          });
        }

        if (shopListContainer) {
          // クリックで次の画像へ
          shopListContainer.addEventListener("click", (e) => {
            const toggle = e.target.closest(".shop-card-comment-toggle");
            if (toggle) {
              const wrapper = toggle.closest(".shop-card-comment");
              const isOpen = wrapper.classList.toggle("is-open");
              toggle.setAttribute("aria-expanded", String(isOpen));
              return;
            }
            const card = e.target.closest(".multi-img");
            if (card) switchSlide(card, 1);
          });

          // タッチ開始
          shopListContainer.addEventListener(
            "touchstart",
            (e) => {
              if (e.target.closest(".multi-img")) {
                sliderTouchX = e.touches[0].clientX;
              }
            },
            { passive: true },
          );

          // タッチ終了（フリック方向で切り替え）
          shopListContainer.addEventListener(
            "touchend",
            (e) => {
              const card = e.target.closest(".multi-img");
              if (!card || sliderTouchX === null) return;
              const dx = e.changedTouches[0].clientX - sliderTouchX;
              sliderTouchX = null;
              if (Math.abs(dx) < 25) return; // 小さすぎる動きは無視
              switchSlide(card, dx < 0 ? 1 : -1);
            },
            { passive: true },
          );
        }

        if (filterSelect && sortKeySelect && sortOrderSelect) {
          filterSelect.addEventListener("change", renderList);
          sortKeySelect.addEventListener("change", renderList);
          sortOrderSelect.addEventListener("change", renderList);
        }

        (async () => {
          try {
            const response = await fetch("js/shop.json");
            if (!response.ok)
              throw new Error("shop.jsonの読み込みに失敗しました。");
            allShops = await response.json();
            renderList();
          } catch (error) {
            console.error(error);
            if (shopListContainer) {
              shopListContainer.textContent =
                "企画情報の読み込み中にエラーが発生しました。";
            }
          }
        })();
      });
    </script>

    <script>
      (function () {
        "use strict";
        var modal = document.getElementById("map-modal");
        if (!modal) return;

        var mapButton = document.getElementById("map-button");
        var closeBtn = modal.querySelector(".modal-close-btn");
        var mapPanels = modal.querySelectorAll(".map-panel");
        var switchBtns = modal.querySelectorAll(".map-switch-button");

        var zoomInstances = {}; // mapId -> PinchZoom instance
        var overlayReady = {}; // mapId -> bool（リスナー登録済み）

        /* --------------------------------------------------
         * PinchZoom コンストラクタを安全に取得
         * UMD ビルドによって PinchZoom / PinchZoom.default のどちらかに入る
         * -------------------------------------------------- */
        function getPZ() {
          if (typeof PinchZoom === "undefined") return null;
          if (typeof PinchZoom === "function") return PinchZoom;
          if (typeof PinchZoom.default === "function") return PinchZoom.default;
          return null;
        }

        /* --------------------------------------------------
         * 指定パネルのズームと操作ガイドを初期化
         * -------------------------------------------------- */
        function setupPanel(mapId) {
          var container = modal.querySelector(
            '.map-zoom-container[data-map-id="' + mapId + '"]',
          );
          if (!container) return;

          // ── PinchZoom ──
          // img 要素をズーム対象にする（container を渡すと overflow:hidden と干渉する）
          if (!zoomInstances[mapId]) {
            var img = container.querySelector("img");
            var PZ = getPZ();
            if (img && PZ) {
              try {
                zoomInstances[mapId] = new PZ(img, {
                  draggableUnzoomed: true, // ズーム前でもドラッグで移動可
                  minZoom: 1,
                  maxZoom: 5,
                });
              } catch (e) {
                console.warn("PinchZoom init failed:", e);
              }
            }
          }

          // ── 操作ガイドオーバーレイ ──
          // 重複登録を防ぐ・最初の操作（タッチ or クリック）で非表示
          if (!overlayReady[mapId]) {
            var overlay = container.querySelector(".map-instruction-overlay");
            if (overlay) {
              function dismiss() {
                overlay.classList.add("hidden");
                try {
                  localStorage.setItem("mapGuideViewed", "true");
                } catch (e) {}
              }
              // pointer-events:none のためイベントはコンテナに届く
              container.addEventListener("touchstart", dismiss, {
                once: true,
                passive: true,
              });
              container.addEventListener("mousedown", dismiss, { once: true });
            }
            overlayReady[mapId] = true;
          }
        }

        /* --------------------------------------------------
         * 表示マップを切り替え
         * -------------------------------------------------- */
        function setActiveMap(target) {
          mapPanels.forEach(function (panel) {
            panel.classList.toggle(
              "active",
              panel.id === "map-panel-" + target,
            );
          });
          switchBtns.forEach(function (btn) {
            btn.classList.toggle("active", btn.dataset.mapTarget === target);
          });
          setupPanel(target);
        }

        /* --------------------------------------------------
         * モーダルの開閉
         * -------------------------------------------------- */
        function openModal() {
          document.body.classList.add("modal-open");
          modal.style.display = "block";

          // 初回：ガイド表示 / 2回目以降：非表示
          var seen = false;
          try {
            seen = !!localStorage.getItem("mapGuideViewed");
          } catch (e) {}
          modal
            .querySelectorAll(".map-instruction-overlay")
            .forEach(function (el) {
              el.classList.toggle("hidden", seen);
            });

          setActiveMap("outside");
        }

        function closeModal() {
          document.body.classList.remove("modal-open");
          modal.style.display = "none";
        }

        // イベント登録
        if (mapButton) mapButton.addEventListener("click", openModal);
        closeBtn.addEventListener("click", closeModal);

        modal
          .querySelector(".map-switcher")
          .addEventListener("click", function (e) {
            var btn = e.target.closest(".map-switch-button");
            if (btn && btn.dataset.mapTarget)
              setActiveMap(btn.dataset.mapTarget);
          });

        modal.addEventListener("click", function (e) {
          if (e.target === modal) closeModal();
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && modal.style.display === "block")
            closeModal();
        });
      })();
    </script>
